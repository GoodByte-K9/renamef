#
[projects.scripts]
renamef = "main:main"  # Users need to use "pip install ." at project root to create an isolated environment for the app and
                       # puts renamef on system PATH to enable it to run from terminal regardless of cwd

[llm]
model = "gemma4:e2b"

# Adding languages requires downloading relevant language packs to the tessdata folder
# You can find them at: https://github.com/tesseract-ocr/tessdata
[ocr]
languages = "eng+deu+fin"
tessdata = "default"
