[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "renamef"
license = "AGPL-3.0-or-later"
version = "26.11.0"
requires-python = ">=3.12"
dependencies = [
    "openai>=3.35",
    "psutil>=7.2",
    "pymupdf>=2.0",
    "pymupdf4llm>=2.0",
    "requests>=2.34",
    "tqdm>=4.70",
]

[project.urls]
Repository = "https://github.com/GoodByte-K9/renamef"
Issues = "https://github.com/GoodByte-K9/renamef/issues"

[project.scripts]
renamef = "renamef.main:run"

[tool.setuptools]
packages = ["renamef"]

[tool.setuptools.package-data]
renamef = ["config.toml", "tessdata/*"]
