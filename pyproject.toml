[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "renamef"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "openai>=3.35",
    "pymupdf>=2.0",
    "pymupdf4llm>=2.0",
    "requests>=2.34",
    "tqdm>=4.70",
]

[project.scripts]
renamef = "main:main"

[tool.setuptools]
py-modules = ["main", "commands", "config", "file_reader", "llm_client",
              "ollama_manager", "prompts", "renamer", "texts", "tool_results"]
